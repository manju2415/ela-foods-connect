
name: Build Ela Bazar for Appetize

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app for Appetize
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$RUNNER_TEMP/appetize-ios.zip"

      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: elabazar-ios-simulator
          path: ${{ runner.temp }}/appetize-ios.zip
          if-no-files-found: error
          retention-days: 7
